<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Face & Hand Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Intro Screen -->
    <div id="intro-screen" class="intro-screen">
        <div class="intro-content">
            <h1 class="intro-title">Particle Tracking Experience</h1>
            <p class="intro-description">Watch thousands of particles flow to form your hands and face in real-time</p>
            <button id="enable-camera-btn" class="enable-camera-btn">Enable Camera</button>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="app-container hidden">
        <!-- Particle Canvas (fullscreen) -->
        <canvas id="particle-canvas"></canvas>

        <!-- Camera Preview Overlay -->
        <div id="camera-preview" class="camera-preview">
            <video id="camera-video" autoplay playsinline></video>
            <canvas id="overlay-canvas"></canvas>
        </div>

        <!-- UI Controls -->
        <div id="controls" class="controls">
            <button id="mode-toggle-btn" class="control-btn">Mode: Attract</button>
            <button id="theme-btn" class="control-btn">Theme: Rainbow</button>
        </div>

        <!-- Status Indicator -->
        <div id="status-indicator" class="status-indicator">
            <span id="status-text">Initializing...</span>
        </div>

        <!-- Keyboard Shortcuts Panel -->
        <div id="shortcuts-panel" class="shortcuts-panel">
            <h3>Keyboard Shortcuts</h3>
            <div class="shortcut-row">
                <span class="shortcut-key">SPACE</span>
                <span class="shortcut-desc">Toggle Mode</span>
            </div>
            <div class="shortcut-row">
                <span class="shortcut-key">V</span>
                <span class="shortcut-desc">Toggle Camera</span>
            </div>
            <div class="shortcut-row">
                <span class="shortcut-key">T</span>
                <span class="shortcut-desc">Change Theme</span>
            </div>
            <div class="shortcut-row">
                <span class="shortcut-key">Fist</span>
                <span class="shortcut-desc">Cycle Theme</span>
            </div>
        </div>
    </div>

    <!-- MediaPipe Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <!-- App Scripts -->
    <script type="module" src="main.js"></script>
</body>
</html>
